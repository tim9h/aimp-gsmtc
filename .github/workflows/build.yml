name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Build plugin and test tools
        shell: pwsh
        run: .\build.ps1

      - name: Package plugin
        shell: pwsh
        run: Compress-Archive -Path build\aimp_mediacontrol.dll, README.md -DestinationPath build\aimp_mediacontrol.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: aimp-mediacontrol
          path: build/aimp_mediacontrol.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aimp-mediacontrol

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: AIMP Media Control v0.1.${{ github.run_number }}
          body: Automated release from the master branch.
          files: aimp_mediacontrol.zip
